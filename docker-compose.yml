# The app on its own, for servers that already run a reverse proxy with HTTPS
# (Coolify, Traefik, nginx...). Point your proxy at this service on APP_PORT
# (default 18446) and set PUBLIC_URL to the address it serves.
# Make sure that proxy keeps no access logs: they would record every secret link.
# No proxy yet? docker-compose.caddy.yml is the same app with Caddy bundled.

# Keeps logs from filling the disk, whatever an attacker sends.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env, e.g. https://files.example.com}
      PORT: ${APP_PORT:-18446}
      TRUST_PROXY: "1"
      SITE_NAME: ${SITE_NAME:-SealDrop}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-50}
      DISCORD_COPIES: ${DISCORD_COPIES:-1}
      DISCORD_COPY_OVER_MB: ${DISCORD_COPY_OVER_MB:-45}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_GROUP: ${OIDC_ALLOWED_GROUP:-}
      OIDC_NAME: ${OIDC_NAME:-}
      MEMBER_KEY: ${MEMBER_KEY:-}
    # Reachable by your proxy over Docker's network only: no ports are published on the server.
    expose:
      - "${APP_PORT:-18446}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    # Discord copies are encoded in memory (/dev/shm), up to 45 MB each, one at a time.
    shm_size: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
