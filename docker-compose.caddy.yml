# The app with Caddy bundled in front of it, for a server with no proxy of its own.
# Caddy takes ports 80 and 443 and gets the HTTPS certificate for CADDY_DOMAIN.
#   docker compose -f docker-compose.caddy.yml up -d --build

# Keeps logs from filling the disk, whatever an attacker sends.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *logging
    networks:
      - internal
      # Sign-in through Pocket ID (OIDC) needs the app to reach it. Uncomment to allow that,
      # which also lifts the app's "no route to the internet" isolation.
      # - web
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}}
      PORT: ${APP_PORT:-18446}
      TRUST_PROXY: "1"
      SITE_NAME: ${SITE_NAME:-SealDrop}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-50}
      DISCORD_COPIES: ${DISCORD_COPIES:-1}
      DISCORD_COPY_OVER_MB: ${DISCORD_COPY_OVER_MB:-45}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_GROUP: ${OIDC_ALLOWED_GROUP:-}
      OIDC_NAME: ${OIDC_NAME:-}
      MEMBER_KEY: ${MEMBER_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - data:/data
    # The app is only reachable through Caddy: no ports are published.
    read_only: true
    tmpfs:
      - /tmp
    # Discord copies are encoded in memory (/dev/shm), up to 45 MB each, one at a time.
    shm_size: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    networks:
      - internal
      - web
    depends_on:
      - app
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env (uncomment the Caddy section)}
      APP_PORT: ${APP_PORT:-18446}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  # The app has no route to the internet or anything else, only to Caddy.
  internal:
    internal: true
  web:

volumes:
  data:
  caddy_data:
  caddy_config:
